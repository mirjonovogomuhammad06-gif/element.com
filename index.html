<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Периодическая система химических элементов</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(21, 30, 48, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;

            /* Неоновые цвета категорий */
            --nonmetal: #38bdf8;
            --noble-gas: #f59e0b;
            --alkali-metal: #ef4444;
            --alkaline-earth: #f97316;
            --metalloid: #10b981;
            --post-transition: #84cc16;
            --transition-metal: #ec4899;
            --halogen: #d946ef;
            --lanthanide: #a855f7;
            --actinide: #6366f1;
            --unknown: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-color) 80%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Панель управления */
        .controls {
            width: 100%;
            max-width: 1280px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 22px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .search-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        /* Кнопки категорий */
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 1100px;
        }

        .btn-filter {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(5px);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-filter:hover, .btn-filter.active {
            color: #0f172a;
            background: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* Контейнер таблицы */
        .table-container {
            width: 100%;
            max-width: 1320px;
            overflow-x: auto;
            padding: 10px 0 20px 0;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, minmax(60px, 1fr));
            grid-template-rows: repeat(10, 64px);
            gap: 6px;
            min-width: 1150px;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        /* Карточка элемента */
        .element {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 5px 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
        }

        .element:hover {
            transform: translateY(-5px) scale(1.12);
            z-index: 30;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(30, 41, 59, 0.9);
        }

        .element.dimmed {
            opacity: 0.12;
            filter: grayscale(90%);
            transform: scale(0.95);
        }

        .element .num {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .element .symbol {
            font-size: 1.25rem;
            font-weight: 800;
            text-align: center;
            line-height: 1;
        }

        .element .name {
            font-size: 0.58rem;
            text-align: center;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Подсветка категорий (Верхняя полоса) */
        .nonmetal { border-top: 3px solid var(--nonmetal); }
        .noble-gas { border-top: 3px solid var(--noble-gas); }
        .alkali-metal { border-top: 3px solid var(--alkali-metal); }
        .alkaline-earth { border-top: 3px solid var(--alkaline-earth); }
        .metalloid { border-top: 3px solid var(--metalloid); }
        .post-transition { border-top: 3px solid var(--post-transition); }
        .transition-metal { border-top: 3px solid var(--transition-metal); }
        .halogen { border-top: 3px solid var(--halogen); }
        .lanthanide { border-top: 3px solid var(--lanthanide); }
        .actinide { border-top: 3px solid var(--actinide); }
        .unknown { border-top: 3px solid var(--unknown); }

        /* Всплывающее окно (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            max-width: 440px;
            width: 90%;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover { color: #fff; }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .modal-badge {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .modal-badge .m-num { font-size: 0.8rem; color: var(--text-muted); }
        .modal-badge .m-sym { font-size: 2.2rem; font-weight: 800; }

        .modal-title h2 { font-size: 1.6rem; color: #fff; }
        .modal-title p { font-size: 0.9rem; color: #38bdf8; margin-top: 4px; font-weight: 600; }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .info-row span.label { color: var(--text-muted); }
        .info-row span.val { font-weight: 600; color: #f8fafc; }

        /* Мобильные устройства */
        @media (max-width: 768px) {
            h1 { font-size: 1.6rem; }
            .filter-buttons { justify-content: flex-start; overflow-x: auto; padding-bottom: 8px; width: 100%; }
            .btn-filter { flex-shrink: 0; }
        }
    </style>
</head>

        let selectedCategory = 'all';
        const table = document.getElementById('table');

        // Отрисовка элементов в сетке
        function renderTable() {
            table.innerHTML = '';
            elements.forEach(el => {
                const card = document.createElement('div');
                card.className = `element ${el.cat}`;
                card.style.gridRow = el.row;
                card.style.gridColumn = el.col;
                card.dataset.num = el.num;

                card.innerHTML = `
                    <span class="num">${el.num}</span>
                    <span class="symbol">${el.sym}</span>
                    <span class="name">${el.name}</span>
                `;

                if (el.mass !== "---") {
                    card.onclick = () => openModal(el);
                }
                table.appendChild(card);
            });
        }

        // Фильтрация по категориям
        function setGroup(category, btn) {
            selectedCategory = category;
            
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            filterElements();
        }

        // Фильтрация и поиск
        function filterElements() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            document.querySelectorAll('.element').forEach(card => {
                const num = card.dataset.num;
                const elData = elements.find(e => e.num == num);

                if (!elData) return;

                const matchCategory = (selectedCategory === 'all' || elData.cat === selectedCategory);
                const matchSearch = elData.name.toLowerCase().includes(query) || 
                                    elData.sym.toLowerCase().includes(query) || 
                                    elData.num.toString() === query;

                if (matchCategory && matchSearch) {
                    card.classList.remove('dimmed');
                } else {
                    card.classList.add('dimmed');
                }
            });
        }

        // Открытие карточки
        function openModal(el) {
            document.getElementById('mNum').innerText = el.num;
            document.getElementById('mSym').innerText = el.sym;
            document.getElementById('mName').innerText = el.name;
            document.getElementById('mCat').innerText = el.catRu;
            document.getElementById('mNumVal').innerText = el.num;
            document.getElementById('mMass').innerText = el.mass + " а.е.м.";
            
            let period = el.row;
            if (el.row === 9) period = 6;
            if (el.row === 10) period = 7;
            
            document.getElementById('mPeriod').innerText = period;
            document.getElementById('mGroup').innerText = el.col;
            document.getElementById('mState').innerText = el.state;

            const modal = document.getElementById('modal');
            modal.classList.add('active');
        }

        function closeModal(e) {
            if (e.target.classList.contains('modal-overlay')) {
                document.getElementById('modal').classList.remove('active');
            }
        }

        function forceCloseModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Запуск
        renderTable();
    </script>
